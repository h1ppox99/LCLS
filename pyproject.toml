[project]
name = "xtc-agent"
version = "0.1.0"
description = "Agentic X-ray scattering reduction pipeline for LCLS XTC data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.81",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyFAI>=2024.1",
    "python-dotenv>=1.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
xtc-agent = "agent.entrypoint:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["agent/.claude", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
