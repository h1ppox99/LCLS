[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automask"
version = "0.1.0"
description = "Automatic Jungfrau1M detector masking for LCLS experiment xppl1016922 (XPP/SLAC)"
requires-python = ">=3.7"
# Runtime deps. psana is NOT here: it ships via the ana conda env (see psana_env.sh),
# so install this package with `pip install -e . --no-deps` inside that env to avoid
# pip touching numpy/scipy and breaking psana.
dependencies = [
    "numpy",
    "h5py",
    "scipy",
    "ipykernel",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "hydra-core",
    "pyFAI",
    "pytest"
]

[project.optional-dependencies]
agent = ["claude-agent-sdk==0.2.139"]

[project.scripts]
lcls-agent = "lcls_agent.cli:main"

[tool.setuptools.packages.find]
include = ["automask*", "lcls_agent*"]
namespaces = false

[tool.ruff]
target-version = "py37"
extend-exclude = ["xpp_sharing"]
