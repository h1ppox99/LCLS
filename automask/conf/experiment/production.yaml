# @package _global_
# The default recipe: TV variance + hough_lines + asic_polish, unioned. Lists the
# EVIDENCE channels only -- the geometry + pixel-status floor is not swept and is
# added by sweep_hyperparameters.build_pipeline. Mirrors
# masking.production_pipeline(); keep the two in step when either changes.
# Use combine=weighted_sum to reproduce combo_sum instead.
channels:
  - stat: variance
    params: {k: 3.5, mode: low}
    field_reg: tv
    field_reg_params: {weight: 4.0}
    mask_reg: null
  # kind="pick": emits a mask, so field_reg MUST be null (a field_reg here raises).
  - stat: hough_lines
    params: {defectiveness_scale: 5.0}
    field_reg: null
    mask_reg: null
  - stat: asic_polish
    params: {asic: 256, n_iter: 3, k: 15.0, mode: high}
    field_reg: [blob_scale]
    field_reg_params: [{radii: [6, 9, 12, 16]}]
    mask_reg: [fill_holes, area_gate]
    mask_reg_params: [{connectivity: 1}, {min_area: 200, connectivity: 2}]
