# @package _global_
# The default recipe: TV variance + sigma-clipping
# on the geometry+calib floor, unioned. Matches masking.main().
# Use combine=weighted_sum to reproduce combo_sum instead.
detectors:
  - stat: variance
    stat_params: {k: 3.5, mode: low}
    field_reg: tv
    field_reg_params: {weight: 4.0}
    mask_reg: null
  - stat: sigma_clipping
    stat_params: {k: 5.0, mode: both}
    field_reg: tv
    field_reg_params: {weight: 1.0}
    mask_reg: null
