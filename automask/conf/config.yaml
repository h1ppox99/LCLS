# Default sweep config: ONE evidence channel (stat + field-reg + optional mask-reg)
# unioned onto the standard geometry + pixel-status floor. The floor is added by
# build_pipeline and is never swept. Override any
# field on the CLI; use -m (multirun) to sweep, e.g.
#   python studies/sweep_hyperparameters.py -m \
#     stat=variance stat.params.k=2,2.5,3,3.5 regularization.params.weight=5,10,15
# Select a full multi-channel recipe with e.g. experiment=production.
defaults:
  - stat: variance
  - regularization: tv
  - mask_reg: none
  - combine: union
  - eval: default
  - _self_
  - optional experiment: null

# Set by an experiment (# @package _global_); null => single channel from the groups.
channels: null

# Emit per-run agreement figures into outputs/figures/.
figures: false

hydra:
  run:
    dir: outputs/sweeps/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
