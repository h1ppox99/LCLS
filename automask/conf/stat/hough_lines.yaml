# kind="pick": emits a mask, not a field. Sweep it with regularization=none --
# a field-regularizer on a pick stat is an error, not a no-op.
name: hough_lines
params:
  radius: 5
  bin_k: 4.0
  min_size: 4
  threshold: 10
  line_length: 100
  line_gap: 5
  width: 1
  exclude_floor: true
  defectiveness_scale: null
