# The evaluation set. Grows here (mirrors evaluation.EVAL_RUNS).
runs: [389, 475]

# Scoring. `synthetic: true` (the DEFAULT) scores each swept pipeline with the
# synthetic-artifact evaluation (automask.synthetic) -- inject artifacts + the
# `original` no-artifact case, score over both -- instead of the real-run
# evaluation.evaluate. Set `synthetic: false` to score against the human masks.
synthetic: true
synthetic_seed: 0
synthetic_n_per: 3
synthetic_rotations: [0, 180]     # 90/270 transpose the non-square grid
# Artifact parameter suite (streak / beamstop / beamstop_small). Loaded from the
# shipped pipeline config so the definitions live in one place.
synthetic_config: synthetic/config/synthetic_pipeline.yaml
